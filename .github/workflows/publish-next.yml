name: publish-next

on:
  # 自動公開は停止中（2026-11-04）。published: true は手で設定し、反映はローカルの毎日ジョブ(sync-published.sh)が行う。
  # 再開するなら schedule: - cron: "0 22 * * 0,2,4"（月水金 7:00 JST）を戻す。手動実行は workflow_dispatch から。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: next
        run: node scripts/publish-next.js
      - name: Commit and push
        if: steps.next.outputs.slug != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish-queue.txt articles
          git commit -m "Publish ${{ steps.next.outputs.slug }}"
          git push
