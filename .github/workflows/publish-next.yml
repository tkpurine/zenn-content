name: publish-next

on:
  schedule:
    - cron: "0 22 * * *" # 毎朝7:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: next
        run: node scripts/publish-next.js
      - name: Commit and push
        if: steps.next.outputs.slug != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish-queue.txt articles
          git commit -m "Publish ${{ steps.next.outputs.slug }}"
          git push
